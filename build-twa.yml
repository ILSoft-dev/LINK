name: Build TWA APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/build-twa.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Bubblewrap 1.25 проверяет SDK так: в корне пути должна лежать папка `bin`
      # (или `tools`) с sdkmanager. У предустановленного на раннере SDK её нет —
      # там только cmdline-tools/latest/bin, отсюда ошибка "The provided androidSdk
      # isn't correct". Собираем отдельный SDK: cmdline-tools копируем и в корень
      # (для Bubblewrap), и в cmdline-tools/latest (для Gradle/AGP, которому нужен
      # sdkmanager внутри SDK). Пакеты под шаблон Bubblewrap 1.25 (compileSdk 36,
      # AGP 8.9.1 -> build-tools 35.0.0) ставим заранее, чтобы Gradle ничего не докачивал.
      - name: Prepare Android SDK for Bubblewrap
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cp -r "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/latest/." "$SDK/"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK" > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"
          echo "ANDROID_SDK_FOR_BW=$SDK" >> "$GITHUB_ENV"
          # У раннера уже задан ANDROID_SDK_ROOT на его собственный SDK; Bubblewrap
          # выставляет ANDROID_HOME на наш. Gradle падает, если пути различаются,
          # поэтому переопределяем и ANDROID_SDK_ROOT на наш SDK.
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap to JDK/SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_FOR_BW"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      # SEC: пароли keystore — ТОЛЬКО из секретов репозитория. Раньше здесь
      # был хардкод "android" (дефолтный пароль debug-keystore) прямо в
      # этом публичном файле — если бы TWA_KEYSTORE_BASE64 когда-нибудь
      # утёк (артефакт, лог, неаккуратный коммит), его открыли бы без
      # всякого перебора. Секреты KEYSTORE_PASSWORD / KEY_PASSWORD нужно
      # завести в Settings -> Secrets and variables -> Actions ДО первого
      # запуска этого workflow, см. инструкцию по смене пароля в чате.
      - name: Restore signing keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Не задан секрет TWA_KEYSTORE_BASE64 (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ -z "$STOREPASS" ]; then
            echo "::error::Не задан секрет KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          echo "Отпечаток ключа подписи (должен совпадать с assetlinks.json):"
          keytool -list -v -keystore android.keystore -storepass "$STOREPASS" -alias androiddebugkey | grep "SHA256:"

      - name: Generate Android project from twa-manifest.json
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      # SEC: Certificate Pinning убран. TWA не рендерит контент в WebView
      # внутри процесса этого приложения — контент открывается в Chrome
      # (тот же механизм, что Custom Tabs, отдельный процесс/браузер).
      # NetworkSecurityConfig действует на сетевые запросы САМОГО
      # приложения (HttpsURLConnection, встроенный WebView) — а fetch() из
      # JS на странице LINK выполняется внутри Chrome, с его собственным
      # сетевым стеком, никак не привязанным к манифесту этого APK. Пин
      # здесь не защищал бы то, ради чего его ставили, а стоил бы
      # обязательной ручной пересборки APK каждые 1-2 месяца из-за ротации
      # сертификата Render. Оставляем только дешёвые, реально действующие
      # флаги харднинга манифеста: без cleartext-трафика и без auto-backup.
      - name: Harden AndroidManifest.xml
        working-directory: android
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          # Bubblewrap сам прописывает android:allowBackup (обычно "true") в
          # сгенерированном манифесте. Раньше мы просто ДОБАВЛЯЛИ свою пару
          # атрибутов после <application>, не проверяя, что там уже есть —
          # получались ДВА android:allowBackup на одном теге (invalid XML,
          # ManifestMerger2 падает на разборе). Сначала вычищаем любые
          # существующие вхождения обоих атрибутов (с любым значением), потом
          # вставляем свою единственную пару.
          sed -i -E \
            -e 's/[[:space:]]*android:allowBackup="[^"]*"//g' \
            -e 's/[[:space:]]*android:usesCleartextTraffic="[^"]*"//g' \
            "$MANIFEST"
          # Bubblewrap может сгенерировать <application ...> с атрибутами на
          # разных строках, а не в одну — поэтому ищем сам открывающий тег
          # без требования пробела сразу после него (сработает что с пробелом,
          # что с переносом строки следом).
          sed -i \
            -e 's#<application#<application android:usesCleartextTraffic="false" android:allowBackup="false"#' \
            "$MANIFEST"
          echo "--- проверка (многострочно, не должна ронять шаг, если не найдёт) ---"
          tr '\n' ' ' < "$MANIFEST" | grep -o '<application[^>]*>' || echo "(тег не показан одной строкой — не критично, ниже прямая проверка атрибутов)"
          echo "--- прямая проверка: должно быть РОВНО по одному вхождению каждого ---"
          grep -c 'usesCleartextTraffic="false"' "$MANIFEST"
          grep -c 'allowBackup="false"' "$MANIFEST"
          echo "--- на всякий случай: убеждаемся, что дублей нет ---"
          [ "$(grep -o 'android:allowBackup="[^"]*"' "$MANIFEST" | wc -l)" -eq 1 ] || { echo "::error::Найдено больше одного android:allowBackup — манифест будет невалиден"; exit 1; }
          [ "$(grep -o 'android:usesCleartextTraffic="[^"]*"' "$MANIFEST" | wc -l)" -eq 1 ] || { echo "::error::Найдено больше одного android:usesCleartextTraffic — манифест будет невалиден"; exit 1; }

      - name: Build APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      # Диагностика: каким сертификатом на самом деле подписан APK и какой у него пакет.
      # sha256 (строчными, без двоеточий) должен начинаться с eb87bec4ae..., пакет — dev.ilsoft.link.
      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          BT="$ANDROID_SDK_FOR_BW/build-tools"
          APKSIGNER=$(ls "$BT"/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$BT"/*/aapt2 | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app-release-signed.apk | grep -E "SHA-256|DN"
          "$AAPT2" dump badging android/app-release-signed.apk | grep -E "^package:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-twa-debug-apk
          path: android/app-release-signed.apk
