name: Build TWA APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/build-twa.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Bubblewrap 1.25 проверяет SDK так: в корне пути должна лежать папка `bin`
      # (или `tools`) с sdkmanager. У предустановленного на раннере SDK её нет —
      # там только cmdline-tools/latest/bin, отсюда ошибка "The provided androidSdk
      # isn't correct". Собираем отдельный SDK нужной раскладки в домашней папке.
      - name: Prepare Android SDK for Bubblewrap
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          cp -r "$ANDROID_HOME/cmdline-tools/latest/." "$SDK/"
          ls "$SDK"
          yes | "$SDK/bin/sdkmanager" --licenses --sdk_root="$SDK" > /dev/null
          echo "ANDROID_SDK_FOR_BW=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap to JDK/SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_FOR_BW"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate debug signing keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=LINK Debug, OU=Dev, O=ILSoft-dev, L=NA, S=NA, C=US" \
            -noprompt

      - name: Generate Android project from twa-manifest.json
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-twa-debug-apk
          path: android/app-release-signed.apk
