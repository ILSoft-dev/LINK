name: Build TWA APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/build-twa.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Bubblewrap 1.25 проверяет SDK так: в корне пути должна лежать папка `bin`
      # (или `tools`) с sdkmanager. У предустановленного на раннере SDK её нет —
      # там только cmdline-tools/latest/bin, отсюда ошибка "The provided androidSdk
      # isn't correct". Собираем отдельный SDK: cmdline-tools копируем и в корень
      # (для Bubblewrap), и в cmdline-tools/latest (для Gradle/AGP, которому нужен
      # sdkmanager внутри SDK). Пакеты под шаблон Bubblewrap 1.25 (compileSdk 36,
      # AGP 8.9.1 -> build-tools 35.0.0) ставим заранее, чтобы Gradle ничего не докачивал.
      - name: Prepare Android SDK for Bubblewrap
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cp -r "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          cp -r "$ANDROID_HOME/cmdline-tools/latest/." "$SDK/"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK" > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"
          echo "ANDROID_SDK_FOR_BW=$SDK" >> "$GITHUB_ENV"
          # У раннера уже задан ANDROID_SDK_ROOT на его собственный SDK; Bubblewrap
          # выставляет ANDROID_HOME на наш. Gradle падает, если пути различаются,
          # поэтому переопределяем и ANDROID_SDK_ROOT на наш SDK.
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap to JDK/SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_FOR_BW"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate debug signing keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=LINK Debug, OU=Dev, O=ILSoft-dev, L=NA, S=NA, C=US" \
            -noprompt

      - name: Generate Android project from twa-manifest.json
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-twa-debug-apk
          path: android/app-release-signed.apk
